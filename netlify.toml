# Netlify configuration for this Next.js 14 (App Router) project.
#
# Without this file, Netlify may not apply the Next.js adapter and instead
# publish the repo as a static folder. Since there is no index.html in the
# repo, every path then returns Netlify's default "Page not found" 404.
#
# Docs: https://docs.netlify.com/frameworks/next-js/overview/

[build]
  command = "next build"
  publish = ".next"

[build.environment]
  # Next.js 14 requires Node >= 18.17
  NODE_VERSION = "20"

# Force-install the Next.js adapter (OpenNext runtime).
# Without this, if the site's Framework preset in the Netlify UI is "None",
# Netlify publishes the raw .next/ directory as static files. Since .next/
# has no index.html at its root, every URL returns Netlify's default
# "Page not found" 404. The adapter converts SSR pages, API routes and
# middleware into Netlify Functions / Edge Functions instead.
# No version is pinned here, so Netlify installs the latest adapter each build.
[[plugins]]
  package = "@netlify/plugin-nextjs"

